<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>速记</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js">
    </script>
    <style>
        :root {
            --bg: #0d1117;
            --card-bg: #161b22;
            --card-hover: #1c2430;
            --border: #30363d;
            --text: #c9d1d9;
            --text-bright: #e8eaed;
            --text-dim: #8b949e;
            --accent: #58a6ff;
            --green: #22c55e;
            --green-bg: rgba(34, 197, 94, 0.12);
            --green-border: rgba(34, 197, 94, 0.45);
            --gold: #f59e0b;
            --gold-bg: rgba(245, 158, 11, 0.08);
            --gold-border: rgba(245, 158, 11, 0.5);
            --red: #f87171;
            --purple: #a78bfa;
            --blue: #60a5fa;
            --pink: #f472b6;
            --radius: 10px;
            --radius-sm: 6px;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            --transition: 0.18s ease;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0d1117;
        }
        ::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4a5568;
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(13, 17, 23, 0.88);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .logo {
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--text-bright);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 500;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            cursor: pointer;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
            white-space: nowrap;
        }
        .btn:hover {
            background: var(--card-hover);
            border-color: #5a6a80;
        }
        .btn-primary {
            background: #1f6feb;
            border-color: #1f6feb;
            color: #fff;
            font-weight: 600;
        }
        .btn-primary:hover {
            background: #388bfd;
            border-color: #388bfd;
        }
        .btn-outline {
            background: transparent;
            border-color: #5c3030;
            color: #f87171;
        }
        .btn-outline:hover {
            background: rgba(248, 113, 113, 0.1);
            border-color: #ef4444;
        }
        .btn-sm {
            padding: 5px 11px;
            font-size: 0.78rem;
        }

        .main-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 18px 16px;
        }
        .upload-zone {
            border: 2px dashed var(--border);
            border-radius: var(--radius);
            padding: 48px 20px;
            text-align: center;
            cursor: pointer;
            transition: all var(--transition);
            background: var(--card-bg);
            margin-bottom: 20px;
            position: relative;
        }
        .upload-zone:hover,
        .upload-zone.drag-over {
            border-color: var(--accent);
            background: #1c2330;
            box-shadow: 0 0 0 4px rgba(88, 166, 255, 0.06);
        }
        .upload-zone .icon {
            font-size: 2.8rem;
            display: block;
            margin-bottom: 10px;
        }
        .upload-zone .title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-bright);
            margin-bottom: 4px;
        }
        .upload-zone .hint {
            font-size: 0.8rem;
            color: var(--text-dim);
        }
        .upload-zone input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        .stats-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-bottom: 16px;
            padding: 12px 16px;
            background: var(--card-bg);
            border-radius: var(--radius);
            border: 1px solid var(--border);
        }
        .stat-tag {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.82rem;
            color: var(--text-dim);
            background: #1a1f2b;
            padding: 4px 12px;
            border-radius: 20px;
            white-space: nowrap;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .dot.single {
            background: #3b82f6;
        }
        .dot.multi {
            background: #a78bfa;
        }
        .dot.judge {
            background: #ec4899;
        }
        .dot.all {
            background: #f59e0b;
        }
        .dot.true {
            background: #22c55e;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
            align-items: center;
        }
        .chip {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.82rem;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            transition: all var(--transition);
            font-weight: 500;
            user-select: none;
            white-space: nowrap;
            font-family: inherit;
        }
        .chip:hover {
            border-color: #8b9bb4;
        }
        .chip.active {
            background: #1f6feb;
            border-color: #1f6feb;
            color: #fff;
            font-weight: 600;
        }
        .chip.all.active {
            background: #4b5563;
            border-color: #6b7280;
        }
        .chip.single.active {
            background: #2563eb;
            border-color: #3b82f6;
        }
        .chip.multi-full.active {
            background: #b45309;
            border-color: #d97706;
        }
        .chip.multi-2.active {
            background: #7c3aed;
            border-color: #8b5cf6;
        }
        .chip.multi-3.active {
            background: #7c3aed;
            border-color: #8b5cf6;
        }
        .chip.multi-all.active {
            background: #7c3aed;
            border-color: #8b5cf6;
        }
        .chip.judge-true.active {
            background: #059669;
            border-color: #10b981;
        }
        .chip.judge-false.active {
            background: #b91c1c;
            border-color: #ef4444;
        }
        .chip.judge-all.active {
            background: #db2777;
            border-color: #ec4899;
        }

        .toggle-switch {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            cursor: pointer;
            font-size: 0.82rem;
            color: var(--text);
            transition: all var(--transition);
            user-select: none;
        }
        .toggle-switch:hover {
            border-color: #8b9bb4;
            background: var(--card-hover);
        }
        .toggle-switch.active {
            background: #1f2937;
            border-color: var(--accent);
            color: var(--text-bright);
        }
        .toggle-icon {
            font-size: 1rem;
            transition: var(--transition);
        }
        .toggle-switch.active .toggle-icon {
            color: var(--accent);
        }

        .search-input {
            flex: 1;
            min-width: 150px;
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: #1a1f2b;
            color: var(--text-bright);
            font-size: 0.85rem;
            outline: none;
            transition: var(--transition);
            font-family: inherit;
        }
        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.1);
        }
        .search-input::placeholder {
            color: var(--text-dim);
        }
        .result-hint {
            font-size: 0.82rem;
            color: var(--text-dim);
            white-space: nowrap;
            margin-left: 6px;
        }

        .question-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .question-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 18px;
            transition: all var(--transition);
            box-shadow: var(--shadow);
            position: relative;
        }
        .question-card:hover {
            border-color: #5a6a80;
        }
        .question-card.highlight-stem-all {
            border-left: 4px solid var(--gold);
            background: linear-gradient(90deg, rgba(245, 158, 11, 0.04) 0%, var(--card-bg) 6%);
        }
        .question-card.highlight-stem-true {
            border-left: 4px solid var(--green);
            background: linear-gradient(90deg, rgba(34, 197, 94, 0.04) 0%, var(--card-bg) 6%);
        }
        .question-card.hidden {
            display: none;
        }

        .card-header {
            display: flex;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 8px;
        }
        .q-num {
            font-weight: 700;
            color: var(--text-dim);
            font-size: 0.8rem;
            padding-top: 2px;
            min-width: 32px;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 3px 10px;
            border-radius: 14px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            white-space: nowrap;
        }
        .badge.single {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
        }
        .badge.multi {
            background: rgba(167, 139, 250, 0.15);
            color: #c4b5fd;
        }
        .badge.judge {
            background: rgba(236, 72, 153, 0.15);
            color: #f472b6;
        }
        .badge.allselect {
            background: rgba(245, 158, 11, 0.18);
            color: #fbbf24;
            font-weight: 700;
        }
        .badge.judgetrue {
            background: rgba(34, 197, 94, 0.18);
            color: #4ade80;
            font-weight: 700;
        }
        .badge.judgefalse {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            font-weight: 700;
        }

        .stem-text {
            flex: 1;
            font-size: 0.95rem;
            color: var(--text-bright);
            line-height: 1.6;
            word-break: break-word;
            overflow-wrap: break-word;
            white-space: pre-wrap;
            min-width: 220px;
        }

        .option-inline {
            display: inline-flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            margin: 0 4px;
            vertical-align: middle;
        }
        .opt-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 4px 10px;
            border-radius: 6px;
            background: #1c2129;
            border: 2px solid #2d333b;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-dim);
            transition: all var(--transition);
            cursor: default;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }
        .opt-box.correct {
            background: var(--green-bg);
            border-color: var(--green-border);
            color: #4ade80;
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.15);
        }
        .opt-box .checkmark {
            margin-left: 4px;
            font-size: 0.8rem;
            opacity: 0;
        }
        .opt-box.correct .checkmark {
            opacity: 1;
        }

        .judge-indicator {
            margin-top: 4px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .judge-indicator.true {
            color: #4ade80;
        }
        .judge-indicator.false {
            color: #f87171;
        }

        @media (max-width: 680px) {
            .header {
                padding: 10px 12px;
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .logo {
                font-size: 1.1rem;
                justify-content: center;
            }
            .actions {
                justify-content: center;
            }
            .main-container {
                padding: 10px 8px;
            }
            .upload-zone {
                padding: 32px 16px;
            }
            .upload-zone .icon {
                font-size: 2.2rem;
            }
            .upload-zone .title {
                font-size: 0.95rem;
            }
            .upload-zone .hint {
                font-size: 0.75rem;
            }
            .stats-bar {
                padding: 10px 12px;
                justify-content: center;
            }
            .stat-tag {
                font-size: 0.75rem;
                padding: 3px 8px;
            }
            .toolbar {
                justify-content: center;
            }
            .chip {
                font-size: 0.75rem;
                padding: 5px 10px;
            }
            .toggle-switch {
                font-size: 0.75rem;
                padding: 5px 10px;
            }
            .search-input {
                min-width: 100%;
                order: -1;
            }
            .question-card {
                padding: 12px 10px;
            }
            .card-header {
                flex-direction: column;
                gap: 6px;
            }
            .q-num {
                font-size: 0.75rem;
            }
            .badge {
                font-size: 0.65rem;
                padding: 2px 8px;
            }
            .stem-text {
                font-size: 0.9rem;
                line-height: 1.7;
                min-width: 100%;
                white-space: pre-wrap;
                word-break: break-word;
                overflow-wrap: break-word;
            }
            .option-inline {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                margin: 8px 0;
                width: 100%;
            }
            .opt-box {
                padding: 6px 10px;
                font-size: 0.82rem;
                flex: 1 1 calc(50% - 4px);
                min-width: 0;
                max-width: 100%;
                justify-content: flex-start;
                text-align: left;
                white-space: normal;
                box-sizing: border-box;
            }
            .btn {
                padding: 7px 12px;
                font-size: 0.8rem;
            }
            .judge-indicator {
                font-size: 0.9rem;
                margin-top: 8px;
            }
        }

        @media (max-width: 480px) {
            .header {
                padding: 8px 10px;
            }
            .logo {
                font-size: 1rem;
            }
            .main-container {
                padding: 8px 6px;
            }
            .question-card {
                padding: 10px 8px;
            }
            .stem-text {
                font-size: 0.85rem;
            }
            .opt-box {
                font-size: 0.78rem;
                min-width: 100px;
                padding: 5px 8px;
            }
            .chip {
                font-size: 0.7rem;
                padding: 4px 8px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo"><span>🛡️</span> 速记</div>
        <div class="actions">
            <button class="btn btn-primary" id="btnUpload">📁 上传</button>
            <button class="btn btn-sm btn-outline" id="btnClear" style="display:none;">🗑️ 清除数据</button>
            <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none;">
        </div>
    </header>

    <div class="main-container" id="mainContainer">
        <div class="upload-zone" id="uploadZone">
            <span class="icon">📤</span>
            <div class="title">点击或拖拽上传 Excel </div>
            <div class="hint">支持 .xlsx / .xls 格式（自动保存进度）</div>
            <input type="file" id="uploadInput" accept=".xlsx,.xls">
        </div>

        <div class="stats-bar" id="statsBar" style="display:none;"></div>

        <div class="toolbar" id="toolbar" style="display:none;">
            <!-- 筛选芯片 -->
            <span class="chip all active" data-filter="all">全部</span>
            <span class="chip single" data-filter="single">单选</span>
            <span class="chip multi-full" data-filter="multi-full">多选(全对)</span>
            <span class="chip multi-2" data-filter="multi-2">多选(对2)</span>
            <span class="chip multi-3" data-filter="multi-3">多选(对3)</span>
            <span class="chip multi-all" data-filter="multi-all">多选(全部)</span>
            <span class="chip judge-true" data-filter="judge-true">判断(对)</span>
            <span class="chip judge-false" data-filter="judge-false">判断(错)</span>
            <span class="chip judge-all" data-filter="judge-all">判断(全部)</span>
            <!-- 选项控制 -->
            <span class="toggle-switch" id="toggleShuffle">
                <span class="toggle-icon">🔀</span> 选项乱序
            </span>
            <span class="toggle-switch" id="toggleOnlyCorrect">
                <span class="toggle-icon">✅</span> 仅正确选项
            </span>
            <input class="search-input" id="searchInput" placeholder="🔍 搜索题干...">
            <span class="result-hint" id="resultHint"></span>
        </div>

        <div class="question-list" id="questionList"></div>
    </div>

    <script>
        (function() {
            const uploadZone = document.getElementById('uploadZone');
            const uploadInput = document.getElementById('uploadInput');
            const fileInput = document.getElementById('fileInput');
            const btnUpload = document.getElementById('btnUpload');
            const btnClear = document.getElementById('btnClear');
            const statsBar = document.getElementById('statsBar');
            const toolbar = document.getElementById('toolbar');
            const questionList = document.getElementById('questionList');

            // 状态
            let allQuestions = [];
            let currentFilter = 'all'; // 'all' | 'single' | 'multi-full' | 'multi-2' | 'multi-3' | 'multi-all' | 'judge-true' | 'judge-false' | 'judge-all'
            let searchQuery = '';
            let optionShuffle = false;
            let onlyCorrect = false;

            // 工具：解析答案
            function parseAnswer(str) {
                if (!str) return [];
                return String(str).trim().split(/[|,\s]+/).filter(s => /^[A-Ja-j]$/.test(s)).map(s => s.toUpperCase());
            }

            function optLetter(index) { return String.fromCharCode(65 + index); }

            function getEffectiveOptions(q) {
                const letters = [];
                for (let i = 0; i < 10; i++) {
                    if (q.options[i] !== null && q.options[i] !== undefined && String(q.options[i]).trim() !== '') {
                        letters.push(optLetter(i));
                    }
                }
                return letters;
            }

            function isFullSelect(q) {
                if (q.type !== 'multi') return false;
                const eff = getEffectiveOptions(q);
                if (eff.length === 0) return false;
                const correctSet = new Set(q.correctOptions);
                return eff.length === correctSet.size && eff.every(o => correctSet.has(o));
            }

            function shuffleArray(arr) {
                const a = [...arr];
                for (let i = a.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [a[i], a[j]] = [a[j], a[i]];
                }
                return a;
            }

            // 加载 Excel
            function loadExcel(file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const wb = XLSX.read(data, { type: 'array' });
                        const sheet = wb.Sheets[wb.SheetNames[0]];
                        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '', raw: true });
                        if (rows.length < 2) { alert('为空或格式不正确'); return; }
                        parseRows(rows);
                        saveToStorage();
                        refreshUI();
                        showDataMode();
                    } catch (err) {
                        alert('解析失败: ' + err.message);
                    }
                };
                reader.readAsArrayBuffer(file);
            }

            function parseRows(rows) {
                allQuestions = [];
                for (let r = 1; r < rows.length; r++) {
                    const row = rows[r];
                    if (!row || !row[0]) continue;
                    const stem = String(row[0]).trim();
                    const typeRaw = String(row[1] || '').trim();
                    const answerRaw = String(row[12] || '').trim();
                    if (!stem || !typeRaw) continue;

                    let type = '';
                    if (typeRaw.includes('单选')) type = 'single';
                    else if (typeRaw.includes('多选')) type = 'multi';
                    else if (typeRaw.includes('判断')) type = 'judge';
                    else continue;

                    const options = [];
                    for (let i = 2; i <= 11; i++) {
                        const v = row[i];
                        options.push(v !== null && v !== undefined && String(v).trim() !== '' ? String(v).trim() : null);
                    }

                    const correctOptions = parseAnswer(answerRaw);
                    allQuestions.push({ id: r, stem, type, options, correctOptions, answerRaw });
                }
                allQuestions.forEach((q, i) => { q.id = i + 1; });
            }

            // 卡片 HTML
            function buildCard(q) {
                const isFull = (q.type === 'multi' && isFullSelect(q));
                const isJudgeTrue = (q.type === 'judge' && q.correctOptions.length > 0 && q.correctOptions[0] === 'A');

                let cardClass = 'question-card';
                if (isFull) cardClass += ' highlight-stem-all';
                if (isJudgeTrue) cardClass += ' highlight-stem-true';

                let badges = '';
                if (q.type === 'single') badges += '<span class="badge single">单选</span> ';
                if (q.type === 'multi') badges += '<span class="badge multi">多选</span> ';
                if (q.type === 'judge') badges += '<span class="badge judge">判断</span> ';
                if (isFull) badges += '<span class="badge allselect">🔒 全选</span> ';
                if (q.type === 'judge') {
                    badges += isJudgeTrue ? '<span class="badge judgetrue">✅ 正确</span> ' :
                        '<span class="badge judgefalse">❌ 错误</span> ';
                }

                let stemHtml = escapeHtml(q.stem);
                const placeholderRegex = /（\s*）|\(\s*\)/;

                const buildOptionBoxes = () => {
                    let effLetters = getEffectiveOptions(q);
                    if (effLetters.length === 0) return '';
                    if (optionShuffle) effLetters = shuffleArray(effLetters);

                    const correctSet = new Set(q.correctOptions);
                    let boxes = '';
                    effLetters.forEach(letter => {
                        const idx = letter.charCodeAt(0) - 65;
                        const optText = q.options[idx] || '';
                        if (onlyCorrect && !correctSet.has(letter)) return;
                        const isCorrect = correctSet.has(letter);
                        boxes +=
                            `<span class="opt-box${isCorrect ? ' correct' : ''}">${letter}. ${escapeHtml(optText)}<span class="checkmark">✓</span></span>`;
                    });
                    return boxes ? `<span class="option-inline">${boxes}</span>` : '';
                };

                const optionBoxesHtml = (q.type === 'single' || q.type === 'multi') ? buildOptionBoxes() : '';

                if (optionBoxesHtml && placeholderRegex.test(stemHtml)) {
                    stemHtml = stemHtml.replace(placeholderRegex, optionBoxesHtml);
                } else if (optionBoxesHtml) {
                    stemHtml += ' ' + optionBoxesHtml;
                }

                let judgeHtml = '';
                if (q.type === 'judge') {
                    judgeHtml =
                        `<div class="judge-indicator ${isJudgeTrue ? 'true' : 'false'}">${isJudgeTrue ? '✅ 正确' : '❌ 错误'}</div>`;
                }

                return `<div class="${cardClass}" data-id="${q.id}">
                          <div class="card-header">
                            <span class="q-num">#${q.id}</span>
                            ${badges}
                            <span class="stem-text">${stemHtml}</span>
                          </div>
                          ${judgeHtml}
                        </div>`;
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // 筛选逻辑
            function getFilteredQuestions() {
                let filtered = [...allQuestions];

                if (currentFilter === 'single') {
                    filtered = filtered.filter(q => q.type === 'single');
                } else if (currentFilter === 'multi-full') {
                    filtered = filtered.filter(q => q.type === 'multi' && isFullSelect(q));
                } else if (currentFilter === 'multi-2') {
                    filtered = filtered.filter(q => q.type === 'multi' && q.correctOptions.length === 2);
                } else if (currentFilter === 'multi-3') {
                    filtered = filtered.filter(q => q.type === 'multi' && q.correctOptions.length === 3);
                } else if (currentFilter === 'multi-all') {
                    filtered = filtered.filter(q => q.type === 'multi');
                } else if (currentFilter === 'judge-true') {
                    filtered = filtered.filter(q => q.type === 'judge' && q.correctOptions.length > 0 && q.correctOptions[
                        0] === 'A');
                } else if (currentFilter === 'judge-false') {
                    filtered = filtered.filter(q => q.type === 'judge' && q.correctOptions.length > 0 && q.correctOptions[
                        0] !== 'A');
                } else if (currentFilter === 'judge-all') {
                    filtered = filtered.filter(q => q.type === 'judge');
                }
                // 'all' 不筛选

                if (searchQuery) {
                    const lower = searchQuery.toLowerCase();
                    filtered = filtered.filter(q => q.stem.toLowerCase().includes(lower));
                }

                return filtered;
            }

            function renderQuestions() {
                const filtered = getFilteredQuestions();
                questionList.innerHTML = filtered.length === 0 ?
                    `<div style="text-align:center;padding:60px;color:var(--text-dim);">📭 没有匹配的题目</div>` :
                    filtered.map(q => buildCard(q)).join('');
                const resultHint = document.getElementById('resultHint');
                if (resultHint) resultHint.textContent = `显示 ${filtered.length}/${allQuestions.length} 题`;
            }

            function renderStats() {
                const total = allQuestions.length;
                const singles = allQuestions.filter(q => q.type === 'single').length;
                const multis = allQuestions.filter(q => q.type === 'multi').length;
                const judges = allQuestions.filter(q => q.type === 'judge').length;
                const fullSelects = allQuestions.filter(q => q.type === 'multi' && isFullSelect(q)).length;
                const judgeTrues = allQuestions.filter(q => q.type === 'judge' && q.correctOptions.length > 0 && q
                    .correctOptions[0] === 'A').length;
                statsBar.innerHTML = `
                  <span style="font-weight:700;color:var(--text-bright);margin-right:6px;">📊 ${total} 题</span>
                  <span class="stat-tag"><span class="dot single"></span> 单选 ${singles}</span>
                  <span class="stat-tag"><span class="dot multi"></span> 多选 ${multis}</span>
                  <span class="stat-tag"><span class="dot all"></span> 全选 ${fullSelects}</span>
                  <span class="stat-tag"><span class="dot judge"></span> 判断 ${judges}</span>
                  <span class="stat-tag"><span class="dot true"></span> 正确 ${judgeTrues}</span>
                `;
                statsBar.style.display = 'flex';
            }

            function updateToolbarUI() {
                document.querySelectorAll('#toolbar .chip').forEach(chip => {
                    const filter = chip.dataset.filter;
                    chip.classList.toggle('active', filter === currentFilter);
                });
                document.getElementById('toggleShuffle').classList.toggle('active', optionShuffle);
                document.getElementById('toggleOnlyCorrect').classList.toggle('active', onlyCorrect);
            }

            function refreshUI() {
                renderStats();
                updateToolbarUI();
                renderQuestions();
            }

            function showUploadMode() {
                uploadZone.style.display = '';
                statsBar.style.display = 'none';
                toolbar.style.display = 'none';
                questionList.innerHTML = '';
                btnClear.style.display = 'none';
            }

            function showDataMode() {
                uploadZone.style.display = 'none';
                statsBar.style.display = 'flex';
                toolbar.style.display = 'flex';
                btnClear.style.display = 'inline-flex';
                refreshUI();
            }

            // 本地存储
            const STORAGE_KEY = 'netsec_exam_bank_v5';
            function saveToStorage() {
                try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ questions: allQuestions, timestamp: Date.now() })); } catch (
                    e) {}
            }
            function loadFromStorage() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) return false;
                    const data = JSON.parse(raw);
                    if (!data.questions || !Array.isArray(data.questions)) return false;
                    allQuestions = data.questions;
                    return true;
                } catch (e) { return false; }
            }
            function clearStorage() { localStorage.removeItem(STORAGE_KEY); }

            // 事件绑定
            uploadZone.addEventListener('click', (e) => { if (e.target !== uploadInput) uploadInput.click(); });
            uploadInput.addEventListener('change', (e) => { if (e.target.files[0]) loadExcel(e.target.files[0]);
                uploadInput.value = ''; });
            btnUpload.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', (e) => { if (e.target.files[0]) loadExcel(e.target.files[0]);
            fileInput.value = ''; });
            btnClear.addEventListener('click', () => {
                if (confirm('确定清除全部题目数据吗？')) { allQuestions = [];
                    clearStorage();
                    showUploadMode(); }
            });

            // 筛选芯片点击
            toolbar.addEventListener('click', (e) => {
                const chip = e.target.closest('.chip');
                if (chip) {
                    currentFilter = chip.dataset.filter;
                    refreshUI();
                }
            });

            // 选项乱序
            document.getElementById('toggleShuffle').addEventListener('click', () => {
                optionShuffle = !optionShuffle;
                refreshUI();
            });

            // 仅正确选项
            document.getElementById('toggleOnlyCorrect').addEventListener('click', () => {
                onlyCorrect = !onlyCorrect;
                refreshUI();
            });

            // 搜索
            document.getElementById('searchInput').addEventListener('input', function() {
                searchQuery = this.value.trim();
                renderQuestions();
                updateToolbarUI();
            });

            // 拖拽上传
            uploadZone.addEventListener('dragover', e => { e.preventDefault();
                uploadZone.classList.add('drag-over'); });
            uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
            uploadZone.addEventListener('drop', e => {
                e.preventDefault();
                uploadZone.classList.remove('drag-over');
                const file = e.dataTransfer.files[0];
                if (file && (file.name.endsWith('.xlsx') || file.name.endsWith('.xls'))) loadExcel(file);
                else alert('请上传 .xlsx 或 .xls 文件');
            });

            document.addEventListener('keydown', e => {
                if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'F') {
                    e.preventDefault();
                    document.getElementById('searchInput')?.focus();
                }
            });

            // 初始化
            if (loadFromStorage() && allQuestions.length > 0) {
                showDataMode();
            } else {
                showUploadMode();
            }
        })();
    </script>
</body>
</html>
