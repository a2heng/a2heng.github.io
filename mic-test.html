<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麦克风测试工具</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a25;
            --text-primary: #e8e8ec;
            --text-secondary: #8a8a9a;
            --accent: #6b7cff;
            --accent-glow: rgba(107, 124, 255, 0.4);
            --success: #4ade80;
            --warning: #fbbf24;
            --danger: #f87171;
            --border: #2a2a3a;
            --grid: #2a2a40;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.8em;
            margin-bottom: 6px;
            color: var(--text-primary);
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.9em;
        }

        .privacy-notice {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 16px;
            font-size: 0.85em;
            color: var(--text-secondary);
            text-align: center;
        }

        .webnav {
            text-align: center;
            font-size: 0.8em;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .webnav a {
            color: var(--text-secondary);
            text-decoration: none;
        }

        .webnav a:hover {
            color: var(--text-primary);
        }

        .webnav span {
            margin: 0 10px;
            opacity: .6;
        }

        .privacy-notice strong {
            color: var(--accent);
        }

        .card {
            background: var(--bg-card);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
        }

        .device-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .device-select {
            flex: 1;
            min-width: 200px;
            padding: 10px 14px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.95em;
            cursor: pointer;
        }

        .device-select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .device-info {
            color: var(--text-secondary);
            font-size: 0.85em;
            white-space: nowrap;
        }

        .meter-container {
            margin-bottom: 20px;
        }

        .meter-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .meter-label {
            font-size: 0.9em;
            color: var(--text-secondary);
        }

        .meter-value {
            font-size: 1.3em;
            font-weight: 600;
            font-family: 'Consolas', monospace;
            min-width: 80px;
            text-align: right;
        }

        .meter-value.good { color: var(--success); }
        .meter-value.warning { color: var(--warning); }
        .meter-value.danger { color: var(--danger); }

        .meter-bar-container {
            position: relative;
            height: 24px;
            background: var(--bg-secondary);
            border-radius: 4px;
            overflow: hidden;
        }

        .meter-bar {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            border-radius: 4px;
            transition: width 0.05s linear;
        }

        .meter-bar.green { background: linear-gradient(90deg, #22c55e, #4ade80); }
        .meter-bar.yellow { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
        .meter-bar.red { background: linear-gradient(90deg, #ef4444, #f87171); }

        .meter-peak {
            position: absolute;
            top: 0;
            width: 2px;
            height: 100%;
            background: white;
            box-shadow: 0 0 4px rgba(255,255,255,0.8);
            transition: left 0.1s linear;
        }

        .meter-scale {
            display: flex;
            justify-content: space-between;
            margin-top: 6px;
            padding: 0 2px;
        }

        .meter-mark {
            font-size: 0.7em;
            color: var(--text-secondary);
            font-family: 'Consolas', monospace;
        }

        /* 频谱容器样式 */
        .spectrum-wrapper {
            position: relative;
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .spectrum-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .spectrum-title {
            font-size: 0.95em;
            color: var(--text-primary);
            font-weight: 500;
        }

        .spectrum-info {
            font-size: 0.8em;
            color: var(--text-secondary);
        }

        #spectrumCanvas {
            width: 100%;
            height: 280px;
            border-radius: 8px;
            display: block;
        }

        .btn {
            padding: 10px 24px;
            border-radius: 6px;
            font-size: 0.95em;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: #5a6bef;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover:not(:disabled) {
            border-color: var(--accent);
        }

        .btn-secondary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-record {
            background: var(--danger);
            color: white;
        }

        .btn-record:hover:not(:disabled) {
            background: #ef4444;
        }

        .btn-record.recording {
            background: var(--warning);
            color: var(--bg-primary);
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .recording-section {
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .recording-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .recording-label {
            font-size: 0.9em;
            color: var(--text-secondary);
        }

        .recording-status {
            font-size: 0.85em;
            color: var(--text-secondary);
        }

        .recording-status.recording {
            color: var(--danger);
        }

        .audio-player {
            width: 100%;
            margin-bottom: 16px;
        }

        .analysis-container {
            margin-top: 16px;
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid var(--border);
        }

        .analysis-label {
            font-size: 0.85em;
            color: var(--text-secondary);
            margin-bottom: 12px;
            text-align: center;
        }

        .waveform-container {
            margin-bottom: 8px;
        }

        #waveformCanvas {
            width: 100%;
            height: 240px;
            background: #000000;
            border-radius: 8px;
            display: block;
        }

        .spectrogram-container {
            margin-top: 8px;
        }

        #spectrogramCanvas {
            width: 100%;
            height: 600px;
            background: #000000;
            border-radius: 8px;
            display: block;
        }

        .status {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 0.9em;
        }

        .status.error {
            background: rgba(248, 113, 113, 0.15);
            color: #f87171;
            border: 1px solid rgba(248, 113, 113, 0.3);
        }

        .status.success {
            background: rgba(74, 222, 128, 0.15);
            color: var(--success);
            border: 1px solid rgba(74, 222, 128, 0.3);
        }

        .status.warning {
            background: rgba(251, 191, 36, 0.15);
            color: var(--warning);
            border: 1px solid rgba(251, 191, 36, 0.3);
        }

        .back-link {
            text-align: center;
            margin-top: 24px;
        }

        .back-link a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9em;
        }

        .back-link a:hover {
            color: var(--accent);
        }

        .recording-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--danger);
            border-radius: 50%;
            margin-right: 6px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div class="container">

        <script>
        let audioContext = null;
        let analyser = null;
        let mediaStream = null;
        let animationId = null;
        let currentDeviceId = null;
        let initStream = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;

        let displayLevel = -60;
        const LEVEL_SMOOTHING = 0.7;  // 电平滑系数 (适中，既平滑又响应快)

        const deviceSelect = document.getElementById('deviceSelect');
        const deviceInfo = document.getElementById('deviceInfo');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const recordBtn = document.getElementById('recordBtn');
        const statusDiv = document.getElementById('status');
        const meterBar = document.getElementById('meterBar');
        const meterPeak = document.getElementById('meterPeak');
        const meterValue = document.getElementById('meterValue');
        const spectrumCanvas = document.getElementById('spectrumCanvas');
        const spectrumCtx = spectrumCanvas.getContext('2d');
        const recordingSection = document.getElementById('recordingSection');
        const recordingStatus = document.getElementById('recordingStatus');
        const audioPlayer = document.getElementById('audioPlayer');
        const waveformCanvas = document.getElementById('waveformCanvas');
        const waveformCtx = waveformCanvas.getContext('2d');
        const spectrogramCanvas = document.getElementById('spectrogramCanvas');
        const spectrogramCtx = spectrogramCanvas.getContext('2d');

        function getDevicesAndPopulate() {
            return navigator.mediaDevices.enumerateDevices().then(devices => {
                const audioInputs = devices.filter(d => d.kind === 'audioinput');

                deviceSelect.innerHTML = '';

                if (audioInputs.length === 0) {
                    deviceSelect.innerHTML = '<option value="">未找到麦克风设备</option>';
                    return [];
                }

                audioInputs.forEach((device, index) => {
                    const option = document.createElement('option');
                    option.value = device.deviceId;
                    option.textContent = device.label || `麦克风 ${index + 1}`;
                    deviceSelect.appendChild(option);
                });

                if (audioInputs.length > 0) {
                    deviceSelect.value = audioInputs[0].deviceId;
                }

                return audioInputs;
            });
        }

        async function init() {
            showStatus('正在请求麦克风权限...', 'warning');

            try {
                initStream = await navigator.mediaDevices.getUserMedia({ audio: true });

                await getDevicesAndPopulate();

                hideStatus();
                startBtn.disabled = false;

            } catch (err) {
                console.error('获取权限失败:', err);
                showStatus('请允许麦克风权限以使用此工具', 'error');
                deviceSelect.innerHTML = '<option value="">需要麦克风权限</option>';
            }
        }

        function showStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
            statusDiv.style.display = 'block';
        }

        function hideStatus() {
            statusDiv.style.display = 'none';
        }

        function updateDeviceInfo(settings) {
            const info = [];
            if (settings.sampleRate) info.push(`${settings.sampleRate}Hz`);
            if (settings.channelCount) info.push(`${settings.channelCount}ch`);
            deviceInfo.textContent = info.join(' | ');
        }

        function getBarColor(db) {
            if (db > -10) return 'red';
            if (db > -20) return 'yellow';
            return 'green';
        }

        function dbToPercent(db) {
            if (db <= -60) return 0;
            return ((db + 60) / 60) * 100;
        }

        function updateMeter(db) {
            const targetLevel = Math.max(-60, Math.min(0, db));

            // 平滑处理 - 快速且平滑
            displayLevel = displayLevel * LEVEL_SMOOTHING + targetLevel * (1 - LEVEL_SMOOTHING);

            const displayPercent = dbToPercent(displayLevel);

            meterBar.style.width = displayPercent + '%';
            meterBar.className = 'meter-bar ' + getBarColor(displayLevel);

            if (db <= -60) {
                meterValue.textContent = '-∞ dB';
            } else {
                meterValue.textContent = db.toFixed(1) + ' dB';
            }

            meterValue.className = 'meter-value ' + getBarColor(db);
        }

        function resizeSpectrumCanvas() {
            const rect = spectrumCanvas.parentElement.getBoundingClientRect();
            spectrumCanvas.width = rect.width * 2; // 高DPI支持
            spectrumCanvas.height = 280 * 2;
        }

        // ========== 优化的频谱绘制 ==========
        // 频谱条峰值保持数组
        let spectrumPeaks = null;
        let spectrumSmoothed = null;  // 平滑后的频谱值
        const SPECTRUM_FALLBACK_SPEED = 0.03;  // 频谱条回落速度 (很慢，超平滑)
        const SPECTRUM_SMOOTHING = 0.9;  // 频谱平滑系数 (0.9=超平滑)

        function drawSpectrum() {
            const width = spectrumCanvas.width;
            const height = spectrumCanvas.height;
            const paddingLeft = 80;
            const paddingRight = 20;
            const paddingTop = 40;
            const paddingBottom = 50;
            const chartWidth = width - paddingLeft - paddingRight;
            const chartHeight = height - paddingTop - paddingBottom;

            // 深色背景
            spectrumCtx.fillStyle = '#0a0a12';
            spectrumCtx.fillRect(0, 0, width, height);

            // 绘制网格线
            spectrumCtx.strokeStyle = 'rgba(60, 60, 90, 0.3)';
            spectrumCtx.lineWidth = 1;
            
            // 水平网格线 (dB)
            for (let i = 0; i <= 4; i++) {
                const y = paddingTop + (chartHeight / 4) * i;
                spectrumCtx.beginPath();
                spectrumCtx.moveTo(paddingLeft, y);
                spectrumCtx.lineTo(width - paddingRight, y);
                spectrumCtx.stroke();
            }

            // 垂直网格线 (频率)
            const minFreq = 20;
            const maxFreq = 20000;
            const logMin = Math.log10(minFreq);
            const logMax = Math.log10(maxFreq);
            
            const freqGridLines = [20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000];
            freqGridLines.forEach(freq => {
                const logPos = (Math.log10(freq) - logMin) / (logMax - logMin);
                const x = paddingLeft + logPos * chartWidth;
                spectrumCtx.beginPath();
                spectrumCtx.moveTo(x, paddingTop);
                spectrumCtx.lineTo(x, paddingTop + chartHeight);
                spectrumCtx.stroke();
            });

            // 绘制频率标签
            const freqLabels = [
                { freq: 20, label: '20' },
                { freq: 100, label: '100' },
                { freq: 500, label: '500' },
                { freq: 1000, label: '1k' },
                { freq: 5000, label: '5k' },
                { freq: 20000, label: '20k' }
            ];

            spectrumCtx.fillStyle = '#8a8a9a';
            spectrumCtx.font = 'bold 20px Consolas, monospace';
            spectrumCtx.textAlign = 'center';

            freqLabels.forEach(({ freq, label }) => {
                const logPos = (Math.log10(freq) - logMin) / (logMax - logMin);
                const x = paddingLeft + logPos * chartWidth;
                spectrumCtx.fillText(label, x, height - 15);
            });

            // dB标签
            spectrumCtx.textAlign = 'right';
            spectrumCtx.fillStyle = '#8a8a9a';
            spectrumCtx.font = 'bold 18px Consolas, monospace';
            const dbLabels = ['0', '-20', '-40', '-60'];
            dbLabels.forEach((db, i) => {
                const y = paddingTop + (chartHeight / 3) * i;
                spectrumCtx.fillText(db, paddingLeft - 12, y + 6);
            });

            // 单位标签
            spectrumCtx.fillStyle = '#6b7cff';
            spectrumCtx.font = 'bold 20px Consolas, monospace';
            spectrumCtx.fillText('dB', paddingLeft - 12, paddingTop - 15);

            if (analyser) {
                const bufferLength = analyser.frequencyBinCount;
                const sampleRate = audioContext.sampleRate;
                const nyquist = sampleRate / 2;
                const dataArray = new Uint8Array(bufferLength);
                analyser.getByteFrequencyData(dataArray);

                // 标准31段EQ中心频率 (ISO标准)
                const eqFrequencies = [
                    20, 25, 31.5, 40, 50, 63, 80, 100, 125, 160, 200, 250, 315, 400, 500,
                    630, 800, 1000, 1250, 1600, 2000, 2500, 3150, 4000, 5000, 6300, 8000,
                    10000, 12500, 16000, 20000
                ];
                const barCount = eqFrequencies.length;
                const barGap = 4;
                const barWidth = (chartWidth - barGap * (barCount - 1)) / barCount;

                // 初始化峰值数组和平滑数组
                if (!spectrumPeaks || spectrumPeaks.length !== barCount) {
                    spectrumPeaks = new Array(barCount).fill(0);
                    spectrumSmoothed = new Array(barCount).fill(0);
                }

                for (let i = 0; i < barCount; i++) {
                    // 获取当前EQ频段的中心频率
                    const freqCenter = eqFrequencies[i];
                    // 计算该频段的频率范围 (用相邻频率的中点)
                    const freqLow = i === 0 ? 20 : Math.sqrt(eqFrequencies[i-1] * freqCenter);
                    const freqHigh = i === barCount - 1 ? 20000 : Math.sqrt(freqCenter * eqFrequencies[i+1]);

                    // 正确的bin计算: bin = freq / nyquist * bufferLength
                    const bin1 = Math.max(0, Math.floor(freqLow / nyquist * bufferLength));
                    const bin2 = Math.max(bin1 + 1, Math.floor(freqHigh / nyquist * bufferLength));

                    // 计算平均能量 - 使用峰值而不是平均值，增强动态
                    let peak = 0;
                    let sum = 0;
                    let count = 0;
                    for (let b = bin1; b < Math.min(bufferLength, bin2); b++) {
                        peak = Math.max(peak, dataArray[b]);
                        sum += dataArray[b];
                        count++;
                    }
                    // 混合峰值和平均值，增强动态
                    const avg = count > 0 ? sum / count : 0;
                    const mixed = peak * 0.7 + avg * 0.3;

                    // 转换为dB并映射到高度 - 扩展动态范围到-80dB
                    const db = 20 * Math.log10((mixed / 255) + 0.00001);
                    const normalizedDb = Math.max(0, (db + 80) / 80); // -80dB to 0dB

                    // 平滑处理 - 超平滑，所有频段一致
                    spectrumSmoothed[i] = spectrumSmoothed[i] * SPECTRUM_SMOOTHING + normalizedDb * (1 - SPECTRUM_SMOOTHING);

                    // 峰值保持和缓慢回落
                    if (spectrumSmoothed[i] > spectrumPeaks[i]) {
                        spectrumPeaks[i] = spectrumSmoothed[i];  // 上升到新峰值
                    } else {
                        spectrumPeaks[i] -= SPECTRUM_FALLBACK_SPEED;  // 缓慢回落
                        if (spectrumPeaks[i] < 0) spectrumPeaks[i] = 0;
                    }

                    const barHeight = spectrumPeaks[i] * chartHeight;

                    // X轴等距离分布
                    const x = paddingLeft + i * (barWidth + barGap);
                    const y = paddingTop + chartHeight - barHeight;

                    // 根据频率位置计算颜色
                    const freqRatio = (Math.log10(freqCenter) - logMin) / (logMax - logMin);
                    
                    // HSL色彩：低频红色(0°)，中频绿色(120°)，高频紫色(270°)
                    const hue = freqRatio * 270;
                    const saturation = 80 + spectrumPeaks[i] * 20; // 动态饱和度
                    const lightness = 30 + spectrumPeaks[i] * 50;  // 动态亮度
                    
                    spectrumCtx.fillStyle = `hsl(${hue}, ${saturation}%, ${lightness}%)`;
                    
                    // 顶部发光效果
                    if (spectrumPeaks[i] > 0.2) {
                        spectrumCtx.shadowColor = `hsl(${hue}, 100%, 70%)`;
                        spectrumCtx.shadowBlur = 10 + spectrumPeaks[i] * 15;
                    } else {
                        spectrumCtx.shadowBlur = 0;
                    }
                    
                    // 圆角条
                    const radius = Math.min(3, barWidth / 2);
                    spectrumCtx.beginPath();
                    spectrumCtx.roundRect(x, y, Math.max(2, barWidth), barHeight, [radius, radius, 0, 0]);
                    spectrumCtx.fill();
                    
                    spectrumCtx.shadowBlur = 0;
                }
            }
        }

        function toggleRecording() {
            if (!isRecording) {
                startRecording();
            } else {
                stopRecording();
            }
        }

        function startRecording() {
            if (!mediaStream) return;

            recordedChunks = [];
            mediaRecorder = new MediaRecorder(mediaStream);

            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) {
                    recordedChunks.push(event.data);
                }
            };

            mediaRecorder.onstop = async () => {
                const webmBlob = new Blob(recordedChunks, { type: 'audio/webm' });
                // 转换为 WAV 格式
                const wavBlob = await convertToWav(webmBlob);
                const url = URL.createObjectURL(wavBlob);
                audioPlayer.src = url;
                recordingSection.style.display = 'block';
                recordingStatus.textContent = '录音完成';
                recordingStatus.classList.remove('recording');

                // 添加下载按钮
                addDownloadButton(url);

                calculateAndDrawAnalysis(wavBlob);
            };

            mediaRecorder.start();
            isRecording = true;
            recordBtn.innerHTML = '<span class="recording-indicator"></span>停止';
            recordBtn.classList.add('recording');
            recordingStatus.textContent = '录音中...';
            recordingStatus.classList.add('recording');
        }

        // 将音频 Blob 转换为 WAV 格式
        async function convertToWav(audioBlob) {
            const arrayBuffer = await audioBlob.arrayBuffer();
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
            
            const numberOfChannels = audioBuffer.numberOfChannels;
            const sampleRate = audioBuffer.sampleRate;
            const format = 1; // PCM
            const bitDepth = 16;
            
            const bytesPerSample = bitDepth / 8;
            const blockAlign = numberOfChannels * bytesPerSample;
            
            // 合并所有通道数据
            const length = audioBuffer.length;
            const buffer = new ArrayBuffer(44 + length * blockAlign);
            const view = new DataView(buffer);
            
            // 写入 WAV 头部
            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + length * blockAlign, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, format, true);
            view.setUint16(22, numberOfChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * blockAlign, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, bitDepth, true);
            writeString(view, 36, 'data');
            view.setUint32(40, length * blockAlign, true);
            
            // 写入音频数据
            const offset = 44;
            const channelData = [];
            for (let i = 0; i < numberOfChannels; i++) {
                channelData.push(audioBuffer.getChannelData(i));
            }
            
            for (let i = 0; i < length; i++) {
                for (let channel = 0; channel < numberOfChannels; channel++) {
                    const sample = Math.max(-1, Math.min(1, channelData[channel][i]));
                    const intSample = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
                    view.setInt16(offset + (i * numberOfChannels + channel) * bytesPerSample, intSample, true);
                }
            }
            
            return new Blob([buffer], { type: 'audio/wav' });
        }
        
        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }
        
        // 添加下载按钮
        function addDownloadButton(audioUrl) {
            // 移除旧的下载按钮
            const oldBtn = document.getElementById('downloadBtn');
            if (oldBtn) oldBtn.remove();
            
            const downloadBtn = document.createElement('a');
            downloadBtn.id = 'downloadBtn';
            downloadBtn.href = audioUrl;
            downloadBtn.download = '录音_' + new Date().toLocaleString().replace(/[/:]/g, '-') + '.wav';
            downloadBtn.className = 'btn btn-secondary';
            downloadBtn.style.marginLeft = '12px';
            downloadBtn.textContent = '下载 WAV';
            
            const btnGroup = document.querySelector('.btn-group');
            btnGroup.appendChild(downloadBtn);
        }

        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                recordBtn.textContent = '录音';
                recordBtn.classList.remove('recording');
            }
        }

        // ── 全时长频谱（wav_browser 同款配置）：FFT4096 / 50%交叠 / 20Hz起 /
        // 1kHz pivot 上下各 256 行（下线性上对数）/ magma / 相对参考 -80~0dB，
        // 整段时长，频率 20Hz–1k–24kHz ──
        const SP_NFFT = 4096, SP_HOP = 2048, SP_ROWS = 512;
        const SP_MAX_COLS = 2000, SP_WAVE_COLS = 3200, SP_WAVE_PAD = 10;
        const SP_FMIN = 20, SP_FMAX = 24000, SP_PIVOT = 1000, SP_PIVOT_RATIO = 0.5;
        const SP_DB_LO = -80, SP_DB_HI = 0;

        function spFft(re, im) {
          const n = re.length;
          for (let i = 1, j = 0; i < n; i++) { let b = n >> 1; for (; j & b; b >>= 1) j ^= b; j ^= b;
            if (i < j) { let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; } }
          for (let len = 2; len <= n; len <<= 1) { const a = -2 * Math.PI / len, wr = Math.cos(a), wi = Math.sin(a);
            for (let i = 0; i < n; i += len) { let cwr = 1, cwi = 0;
              for (let j = 0; j < len / 2; j++) { const ur = re[i + j], ui = im[i + j];
                const vr = re[i + j + len / 2] * cwr - im[i + j + len / 2] * cwi, vi = re[i + j + len / 2] * cwi + im[i + j + len / 2] * cwr;
                re[i + j] = ur + vr; im[i + j] = ui + vi; re[i + j + len / 2] = ur - vr; im[i + j + len / 2] = ui - vi;
                const t = cwr; cwr = cwr * wr - cwi * wi; cwi = t * wi + cwi * wr; } } }
        }

        let _spWin = null, _spBank = null;
        function spBank(sr) {
          if (_spBank && _spBank.sr === sr) return _spBank;
          const nyq = sr / 2, maxBin = Math.max(2, SP_NFFT >> 1), rows = SP_ROWS;
          const fmaxEff = Math.min(SP_FMAX, nyq);
          const pivot = Math.min(Math.max(SP_PIVOT, SP_FMIN + 1), fmaxEff);
          const freqAt = (ratio) => {
            if (ratio <= SP_PIVOT_RATIO || pivot >= fmaxEff)
              return SP_FMIN + (pivot - SP_FMIN) * Math.min(1, ratio / SP_PIVOT_RATIO);
            const ur = (ratio - SP_PIVOT_RATIO) / (1 - SP_PIVOT_RATIO);
            return pivot * Math.exp(Math.log(fmaxEff / pivot) * ur);
          };
          const band = [];
          for (let r = 0; r < rows; r++) {
            const f0 = Math.max(1.0, freqAt(r / rows)), f1 = Math.max(f0 + 1.0, freqAt((r + 1) / rows));
            const b0 = Math.min(Math.max(Math.floor((f0 / nyq) * maxBin), 1), maxBin - 1);
            const b1 = Math.min(Math.max(Math.ceil((f1 / nyq) * maxBin), b0 + 1), maxBin);
            band.push({ start: b0, end: b1 });
          }
          _spBank = { sr, band, rows, fmaxEff };
          return _spBank;
        }

        function spMagma(v) {
          const s = [[0, 0, 4], [28, 16, 68], [79, 18, 123], [129, 37, 129], [181, 54, 122], [229, 80, 100], [251, 135, 97], [254, 194, 135], [252, 253, 191]];
          const x = v * (s.length - 1), i = Math.min(s.length - 2, Math.floor(x)), f = x - i, a = s[i], b = s[i + 1];
          return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
        }

        // 整段 PCM → 波形峰值对 + 混合谱（dB；ref 为外部参考，null 则取自身峰）
        function spAnalyze(y, sr, ref) {
          const bank = spBank(sr), rows = bank.rows, n = y.length;
          const w = Math.min(SP_WAVE_COLS, Math.max(1, n));
          const wf = new Float32Array(w * 2);
          for (let i = 0; i < w; i++) {
            const a = Math.floor(i * n / w), b = Math.max(a + 1, Math.floor((i + 1) * n / w));
            let mn = 1e9, mx = -1e9;
            for (let k = a; k < b; k++) { const v = y[k]; if (v < mn) mn = v; if (v > mx) mx = v; }
            wf[i * 2] = mn; wf[i * 2 + 1] = mx;
          }
          const nWin = Math.max(1, Math.round(n / SP_HOP));
          const merge = Math.max(1, Math.ceil(nWin / SP_MAX_COLS));
          const cols = Math.max(1, Math.ceil(nWin / merge));
          if (!_spWin) { _spWin = new Float64Array(SP_NFFT); for (let i = 0; i < SP_NFFT; i++) _spWin[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / SP_NFFT); }
          const win = _spWin;
          const re = new Float64Array(SP_NFFT), im = new Float64Array(SP_NFFT);
          const frames = new Float32Array(cols * rows);
          for (let c = 0; c < cols; c++) {
            const acc = new Float64Array(rows), cnt = merge;
            for (let m2 = 0; m2 < merge; m2++) {
              const col = c * merge + m2;
              const centre = ((2 * col + 1) * n) / (2 * nWin);
              const s0 = Math.round(centre) - (SP_NFFT >> 1);
              re.fill(0); im.fill(0);
              for (let i = 0; i < SP_NFFT; i++) { const idx = s0 + i; if (idx >= 0 && idx < n) re[i] = y[idx] * win[i]; }
              spFft(re, im);
              for (let r = 0; r < rows; r++) {
                const bd = bank.band[r];
                const sz = Math.max(1, bd.end - bd.start), ps = 1.0 / sz;
                let e = 0, tw = 0;
                for (let b = bd.start; b < bd.end; b++) {
                  const pos = sz === 1 ? 0.5 : ((b - bd.start) + 0.5) * ps;
                  const taper = 1.0 - Math.abs(pos * 2.0 - 1.0);
                  const wt = 0.7 + taper * 0.3;
                  e += (re[b] * re[b] + im[b] * im[b]) * wt; tw += wt;
                }
                acc[r] += e / Math.max(tw, 1e-8);
              }
            }
            for (let r = 0; r < rows; r++) frames[r * cols + c] = acc[r] / cnt;
          }
          let dmax = ref;
          const db = new Float32Array(cols * rows);
          for (let i = 0; i < db.length; i++) db[i] = 10 * Math.log10(frames[i] + 1e-10);
          if (ref == null) { dmax = -1e9; for (let i = 0; i < db.length; i++) if (db[i] > dmax) dmax = db[i]; }
          const lo = dmax + SP_DB_LO, rng = Math.max(SP_DB_HI - SP_DB_LO, 1e-6);
          const data = new Uint8Array(cols * rows);
          for (let i = 0; i < db.length; i++) { let v = (db[i] - lo) / rng; v = v < 0 ? 0 : v > 1 ? 1 : v; data[i] = Math.round(v * 255); }
          return { cols, rows, data, wf, wfCols: w, ref: dmax, fmaxEff: bank.fmaxEff };
        }

        function spSpecImage(data, rows, cols) {
          const t = document.createElement('canvas'); t.width = cols; t.height = rows;
          const g = t.getContext('2d'), img = g.createImageData(cols, rows);
          for (let y = 0; y < rows; y++) { const row = rows - 1 - y;
            for (let x = 0; x < cols; x++) { const v = data[row * cols + x] / 255, c = spMagma(v), o = (y * cols + x) * 4;
              img.data[o] = c[0]; img.data[o + 1] = c[1]; img.data[o + 2] = c[2]; img.data[o + 3] = 255; } }
          g.putImageData(img, 0, 0); return t;
        }

        async function calculateAndDrawAnalysis(audioBlob) {
            const arrayBuffer = await audioBlob.arrayBuffer();
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            try {
                const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                const channelData = audioBuffer.getChannelData(0);
                const sampleRate = audioBuffer.sampleRate;
                const duration = audioBuffer.duration;

                // 全时长分析（FFT4096/50%交叠/20Hz~24kHz混合轴，与 wav_browser 同配置）
                const view = spAnalyze(channelData, sampleRate, null);
                drawWaveform(view.wf, view.wfCols, duration, '录音');
                drawSpectrogram(view, duration);

            } catch (err) {
                console.error('分析失败:', err);
            }
        }

        function drawWaveform(wf, wcols, duration, title) {
            const displayWidth = waveformCanvas.offsetWidth;
            const displayHeight = 240;
            waveformCanvas.width = displayWidth * 2;
            waveformCanvas.height = displayHeight * 2;
            const width = waveformCanvas.width;
            const height = waveformCanvas.height;
            const g = waveformCtx;
            g.fillStyle = '#0a0a12'; g.fillRect(0, 0, width, height);
            g.strokeStyle = 'rgba(60, 60, 90, 0.3)'; g.lineWidth = 1;
            g.beginPath(); g.moveTo(0, height / 2); g.lineTo(width, height / 2); g.stroke();
            const PAD = 10 * 2, inner = Math.max(1, height - 2 * PAD);
            g.strokeStyle = '#6b7cff'; g.lineWidth = 2; g.beginPath();
            for (let i = 0; i < wcols; i++) {
                const x = i / Math.max(1, wcols - 1) * width;
                const a = Math.max(-1, Math.min(1, wf[i * 2])), c = Math.max(-1, Math.min(1, wf[i * 2 + 1]));
                g.moveTo(x, (1 - c) / 2 * inner + PAD); g.lineTo(x, (1 - a) / 2 * inner + PAD);
            }
            g.stroke();
            g.fillStyle = '#8a8a9a'; g.font = 'bold 16px Consolas, monospace'; g.textAlign = 'left';
            g.fillText((title || '') + '  ' + fmt(0) + ' – ' + fmt(duration), 10, 20);
            g.textAlign = 'center';
            const timeLabels = 5;
            for (let i = 0; i < timeLabels; i++) {
                const time = (duration / (timeLabels - 1)) * i;
                const x = (width / (timeLabels - 1)) * i;
                g.fillText(time.toFixed(1) + 's', x, height - 20);
            }
        }

        // 绘制 STFT 频谱图 (Linear 频率刻度)
        function drawSpectrogram(view, duration) {
            const displayWidth = spectrogramCanvas.offsetWidth;
            const displayHeight = 600;
            spectrogramCanvas.width = displayWidth * 2;
            spectrogramCanvas.height = displayHeight * 2;
            const width = spectrogramCanvas.width;
            const height = spectrogramCanvas.height;
            const g = spectrogramCtx;
            g.fillStyle = '#0a0a12'; g.fillRect(0, 0, width, height);
            const spec = spSpecImage(view.data, view.rows, view.cols);
            g.imageSmoothingEnabled = false;
            g.drawImage(spec, 0, 0, spec.width, spec.height, 0, 0, width, height);
            const ySplit = height * SP_PIVOT_RATIO;
            g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 1;
            g.beginPath(); g.moveTo(0, ySplit); g.lineTo(width, ySplit); g.stroke();
            const fmax = view.fmaxEff;
            const top = fmax >= 1000 ? (fmax / 1000).toFixed(0) + 'k' : String(Math.round(fmax));
            g.fillStyle = '#8a8a9a'; g.font = 'bold 16px Consolas, monospace'; g.textAlign = 'left';
            g.fillText(top, 10, 20);
            g.fillText('1k', 10, Math.max(20, ySplit - 14));
            g.fillText('20', 10, height - 40);
            g.textAlign = 'right';
            g.fillText('0dB', width - 10, 20);
            g.fillText('-80dB', width - 10, height - 40);
            g.textAlign = 'center';
            const timeLabels = 5;
            for (let i = 0; i < timeLabels; i++) {
                const time = (duration / (timeLabels - 1)) * i;
                const x = (width / (timeLabels - 1)) * i;
                g.fillText(time.toFixed(1) + 's', x, height - 20);
            }
        }

        async function startAudio(deviceId) {
            try {
                if (mediaStream) {
                    mediaStream.getTracks().forEach(track => track.stop());
                    mediaStream = null;
                }
                if (audioContext) {
                    audioContext.close();
                    audioContext = null;
                }

                if (initStream) {
                    initStream.getTracks().forEach(track => track.stop());
                    initStream = null;
                }

                if (isRecording) {
                    stopRecording();
                }

                peakLevel = -60;
                displayLevel = -60;
                lastRiseTime = 0;
                lastPeakTime = 0;

                const constraints = {
                    audio: deviceId ? { deviceId: { exact: deviceId } } : true
                };

                mediaStream = await navigator.mediaDevices.getUserMedia(constraints);

                currentDeviceId = deviceId || mediaStream.getAudioTracks()[0].getSettings().deviceId;

                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 4096;  // 更大的FFT尺寸，更高的频率分辨率
                analyser.smoothingTimeConstant = 0.1;  // 进一步降低平滑，更快的动态响应

                const source = audioContext.createMediaStreamSource(mediaStream);
                source.connect(analyser);

                const track = mediaStream.getAudioTracks()[0];
                const settings = track.getSettings();
                updateDeviceInfo(settings);

                deviceSelect.value = currentDeviceId;

                startBtn.disabled = true;
                stopBtn.disabled = false;
                recordBtn.disabled = false;

                resizeSpectrumCanvas();
                draw();

            } catch (err) {
                console.error('Error accessing microphone:', err);
                showStatus('无法访问麦克风: ' + err.message, 'error');
            }
        }

        function stopAudio() {
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }

            if (isRecording) {
                stopRecording();
            }

            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }

            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }

            analyser = null;

            peakLevel = -60;
            displayLevel = -60;
            lastRiseTime = 0;
            lastPeakTime = 0;
            updateMeter(-60);

            deviceInfo.textContent = '';

            drawSpectrum();

            startBtn.disabled = false;
            stopBtn.disabled = true;
            recordBtn.disabled = true;
            recordBtn.textContent = '录音';
            recordBtn.classList.remove('recording');

            recordingSection.style.display = 'none';
            audioPlayer.src = '';
            waveformCtx.fillStyle = '#0a0a12';
            waveformCtx.fillRect(0, 0, waveformCanvas.width, waveformCanvas.height);
            spectrogramCtx.fillStyle = '#0a0a12';
            spectrogramCtx.fillRect(0, 0, spectrogramCanvas.width, spectrogramCanvas.height);
        }

        function draw() {
            if (!analyser) return;

            animationId = requestAnimationFrame(draw);

            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteTimeDomainData(dataArray);

            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) {
                const normalized = (dataArray[i] - 128) / 128;
                sum += normalized * normalized;
            }
            const rms = Math.sqrt(sum / dataArray.length);
            const db = 20 * Math.log10(rms + 0.0001);

            updateMeter(db);
            drawSpectrum();
        }

        startBtn.addEventListener('click', () => {
            const deviceId = deviceSelect.value;
            if (deviceId) {
                startAudio(deviceId);
            }
        });

        stopBtn.addEventListener('click', stopAudio);

        recordBtn.addEventListener('click', toggleRecording);

        deviceSelect.addEventListener('change', () => {
            if (mediaStream && deviceSelect.value) {
                stopAudio();
                startAudio(deviceSelect.value);
            }
        });

        window.addEventListener('resize', () => {
            if (analyser) {
                resizeSpectrumCanvas();
            }
        });

        window.addEventListener('beforeunload', () => {
            if (isRecording) {
                stopRecording();
            }
        });

        navigator.mediaDevices.addEventListener('devicechange', async () => {
            if (initStream || mediaStream) {
                await getDevicesAndPopulate();
            }
        });

        init();
    </script>
